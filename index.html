<style>
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Regular.woff2') format('woff2');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Pretendard';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/pretendard@1.0/Pretendard-Black.woff2') format('woff2');
    font-weight: 900;
    font-display: swap;
  }

  @font-face {
    font-family: 'FightingGyeongnam';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607131603@gfcredspirit-black/gfcredspirit-black/GFCRedSpirit-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
  }
  @font-face {
    font-family: 'FightingGyeongnam';
    src: url('https://cdn.jsdelivr.net/gh/Project-Noonnu/2607131603@gfcredspirit-black/gfcredspirit-black/GFCRedSpirit-Bold.woff2') format('woff2');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --ink: #14110f;
    --paper: #ffffff;
    --muted: #a49c96;

    /* pastel item-accent colors */
    --coral: #ff9aa2;
    --mint:  #16b4cd;
    --lemon: #f2b705;

    --antique-paper: #f8f1de;
    --electric-blue: #00c3ff;

    /* deep-turquoise page background + the light text that sits on it */
    --bg-deep:  #0d3b3b;
    --page-ink: #f3ece0;

    /* dedicated wax-seal color for the story popup's "다음" button */
    --wax-burgundy: #7b1e2b;

    /* shared film-grain tile, layered onto every background surface */
    --grain: url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27128%27%20height%3D%27128%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%270.9%27%20numOctaves%3D%272%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20type%3D%27matrix%27%20values%3D%270%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200%200.2%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E");

    --font-latin: "helvetica-neue-lt-pro", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-ko: "helvetica-neue-lt-pro", "Helvetica Neue", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    --font-ko-first: "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    /* story popup + top greeting only */
    --font-story: "FightingGyeongnam", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(140% 90% at 50% -10%, rgba(0,0,0,0.16), transparent 60%),
      radial-gradient(140% 90% at 50% 110%, rgba(0,0,0,0.22), transparent 60%),
      var(--grain),
      var(--bg-deep);
    color: var(--page-ink);
    font-family: var(--font-ko);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  /* ---------- Topbar (HUD row) ---------- */
  .topbar {
    flex: 0 0 auto;
    display: flex;
    justify-content: flex-start;
    padding: clamp(0.7rem, 2.4vh, 1.2rem) 6vw 0;
  }

  /* ---------- Greeting ---------- */
  .greeting {
    flex: 0 0 auto;
    font-family: var(--font-story);
    font-weight: 700;
    color: var(--page-ink);
    text-align: center;
    line-height: 1.4;
    font-size: clamp(1.15rem, min(4vw, 3.4vh), 2.5rem);
    padding: clamp(0.6rem, 2.2vh, 1.2rem) 6vw 0;
  }

  /* ---------- Stage ---------- */
  .stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: clamp(0.9rem, 3.2vh, 2.6rem);
    padding: clamp(1.2rem, 3vh, 3rem) 6vw 0;
    overflow: hidden;
  }

  .word {
    -webkit-appearance: none; appearance: none;
    background: none; border: 0; cursor: pointer;
    display: flex; flex-direction: column; align-items: center;
    gap: 0.45rem; padding: 0.2rem 0.6rem; border-radius: 18px;
    transition: transform 0.35s cubic-bezier(.2,.8,.2,1);
  }
  .word:focus-visible { outline: 3px solid var(--page-ink); outline-offset: 6px; }
  @media (hover: hover) { .word:hover { transform: translateY(-6px); } }
  .word:active { transform: translateY(-2px) scale(0.99); }

  .word .glyphs {
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.02em;
    font-size: clamp(2.6rem, min(15.5vw, 12.5vh), 10rem);
    color: var(--c);
    display: inline-flex;
    white-space: nowrap;
    min-height: 0.92em;
  }
  .word[data-lang="peace"] .glyphs { font-family: var(--font-latin); }
  .word[data-lang="hangul"] .glyphs,
  .word[data-lang="hanja"]  .glyphs { font-family: var(--font-ko-first); }
  .glyphs span { display: inline-block; opacity: 0; }
  .glyphs .emoji { margin-left: 0.06em; }

  .word .label {
    font-family: var(--font-ko-first);
    font-size: clamp(0.72rem, 1.4vw, 0.95rem);
    letter-spacing: normal;
    color: var(--muted);
    opacity: 0;
  }

  /* ---------- Footer: hint + credits ---------- */
  .footer {
    flex: 0 0 auto;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(0.3rem, 1vh, 0.6rem);
    padding: clamp(0.6rem, 2vh, 1.4rem) 6vw clamp(0.8rem, 2.4vh, 1.6rem);
  }

  .hint {
    font-size: clamp(0.72rem, 1.4vw, 1rem);
    font-weight: 500;
    letter-spacing: normal; color: var(--muted);
    opacity: 0; text-align: center; white-space: nowrap;
  }
  .hint a { color: inherit; text-decoration: none; }
  .hint a:hover, .hint a:focus-visible { text-decoration: underline; }

  .credits {
    font-family: var(--font-ko);
    font-size: clamp(0.66rem, 1.3vw, 0.92rem);
    font-weight: 500;
    letter-spacing: normal; color: var(--muted);
    opacity: 0; text-align: center;
    max-width: 92vw; line-height: 1.4;
  }

  /* ---------- Bottom-right icon controls ---------- */
  .bottom-controls {
    flex: 0 0 auto;
    display: flex; justify-content: flex-end; align-items: center;
    gap: 0.6rem;
    padding: 0 6vw;
  }
  .icon-btn {
    width: clamp(38px, 10vw, 46px); height: clamp(38px, 10vw, 46px); border-radius: 50%;
    flex: 0 0 auto;
    border: 1px solid #eee; background: var(--paper); color: var(--muted);
    line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 20px -10px rgba(20,17,15,0.35);
    transition: transform 0.3s cubic-bezier(.2,.8,.2,1), color 0.2s ease, box-shadow 0.3s ease;
  }
  .icon-btn:hover { box-shadow: 0 6px 20px -10px rgba(20,17,15,0.35), 0 0 0 3px rgba(242,183,5,0.4); }
  .icon-btn:focus-visible { outline: 3px solid var(--page-ink); outline-offset: 3px; }
  .replay { font-size: clamp(1.05rem, 4vw, 1.25rem); }
  .replay:hover { transform: rotate(-45deg); color: var(--ink); }
  .story-toggle { font-size: clamp(0.98rem, 3.6vw, 1.15rem); }
  .story-toggle:hover { transform: scale(1.12); color: var(--ink); }

  /* ---------- Spill panel ---------- */
  .scrim {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(1rem, 4vw, 3rem);
    background: rgba(20, 17, 15, 0);
    visibility: hidden;
    transition: background 0.35s ease, visibility 0s linear 0.55s;
    z-index: 50;
  }
  .scrim.open {
    background: rgba(20, 17, 15, 0.24);
    visibility: visible;
    transition: background 0.35s ease, visibility 0s;
  }

  .panel {
    position: relative;
    display: flex; flex-direction: column;
    width: min(960px, 100%);
    max-height: 90dvh;
    border-radius: 6px;
    overflow: hidden;
    background: var(--paper);
    box-shadow: 0 40px 90px -30px rgba(20,17,15,0.4);
    transform: translateY(14px) scale(0.985);
    opacity: 0;
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1), opacity 0.3s ease;
  }
  .scrim.open .panel { transform: none; opacity: 1; }

  .fill {
    position: absolute; inset: 0;
    background-color: var(--antique-paper);
    background-image: var(--grain);
    box-shadow:
      inset 0 0 0 2px var(--c),
      inset 0 0 0 6px var(--antique-paper),
      inset 0 0 0 8px var(--c);
    clip-path: inset(0 0 100% 0);
    transition: clip-path 0.62s cubic-bezier(.5,0,.1,1);
  }
  .scrim.open .fill { clip-path: inset(0 0 0 0); }

  .popup-head {
    position: relative; z-index: 2;
    flex: 0 0 auto;
    display: flex; justify-content: flex-end;
    padding: clamp(1.2rem, 3vw, 2.2rem) clamp(1.2rem, 3vw, 2.2rem) 0;
  }

  .content {
    position: relative;
    flex: 1 1 auto; min-height: 0;
    padding: clamp(0.8rem, 2.4vw, 1.6rem) clamp(2.4rem, 6vw, 5rem) clamp(2.4rem, 6vw, 5rem);
    overflow-y: auto;
    opacity: 0; transform: translateY(16px);
    transition: opacity 0.4s ease 0.3s, transform 0.5s cubic-bezier(.2,.8,.2,1) 0.3s;
  }
  .scrim.open .content { opacity: 1; transform: none; }

  .kicker {
    font-family: var(--font-ko-first);
    font-size: clamp(0.8rem, 1.6vw, 1.05rem);
    letter-spacing: normal;
    color: var(--c); margin-bottom: clamp(0.7rem, 1.8vw, 1.1rem);
    font-weight: 600;
  }

  .p-title {
    font-family: var(--font-latin);
    font-weight: 800; line-height: 0.95; letter-spacing: -0.02em;
    color: var(--c);
    font-size: clamp(2.6rem, 8vw, 5.5rem);
    margin-bottom: clamp(1rem, 2.6vw, 1.8rem);
  }

  /* Item description body: the write-up under the title, in Pretendard,
     dark ink on the paper, tinted by the item's own accent color. */
  .p-body {
    font-family: var(--font-ko-first);
    color: var(--ink);
    margin-top: clamp(1.4rem, 3.5vw, 2.4rem);
    font-size: clamp(1rem, 2.2vw, 1.35rem);
    line-height: 1.62;
  }
  .p-body:empty { display: none; }
  .p-body .p-lead {
    font-weight: 600;
    margin-bottom: clamp(1.2rem, 3vw, 1.9rem);
  }
  .p-body .p-sections {
    list-style: none;
    counter-reset: sec;
    display: flex; flex-direction: column;
    gap: clamp(1.3rem, 3.2vw, 2.1rem);
  }
  .p-body .p-sections > li { counter-increment: sec; }
  .p-body .p-sections > li > h3 {
    font-family: var(--font-ko-first);
    font-size: clamp(1.15rem, 2.7vw, 1.6rem);
    font-weight: 800; line-height: 1.3;
    color: var(--c);
    margin-bottom: clamp(0.5rem, 1.4vw, 0.85rem);
  }
  .p-body .p-sections > li > h3::before { content: counter(sec) ". "; }
  .p-body ul {
    list-style: none;
    display: flex; flex-direction: column;
    gap: clamp(0.4rem, 1.1vw, 0.65rem);
  }
  .p-body ul > li { position: relative; padding-left: 1.15em; }
  .p-body ul > li::before {
    content: "•";
    position: absolute; left: 0; top: 0;
    color: var(--c); font-weight: 700;
  }

  .close {

<script>

  const COLOR = { peace: "var(--coral)", hangul: "var(--mint)", hanja: "var(--lemon)" };

  const COMPAT_LEAD = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
  function stagesFor(ch) {
    const code = ch.codePointAt(0);
    if (code >= 0xAC00 && code <= 0xD7A3) {
      const s = code - 0xAC00;
      const L = Math.floor(s / 588), V = Math.floor((s % 588) / 28), T = s % 28;
      const out = [COMPAT_LEAD[L]];
      const noTail = String.fromCharCode(0xAC00 + L * 588 + V * 28);
      if (noTail !== out[0]) out.push(noTail);
      if (T > 0) out.push(ch);
      return out;
    }
    return [ch];
  }

  const LETTER = 110, JAMO = 170, WORD = 340, START = 350;
  const words = Array.from(document.querySelectorAll(".word"));
  const foot  = [document.getElementById("hint"), document.getElementById("credits")];

  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clearTimers = () => { timers.forEach(clearTimeout); timers = []; };
  const fadeIn = (el, dur) => el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: dur, fill: "both" });

  function play() {
    clearTimers();
    words.forEach((w) => { w.querySelector(".glyphs").innerHTML = ""; w.querySelector(".label").style.opacity = 0; });
    foot.forEach((e) => (e.style.opacity = 0));

    let t = START;
    words.forEach((word) => {
      const container = word.querySelector(".glyphs");
      const chars = Array.from(DATA[word.dataset.key].text);

      chars.forEach((ch) => {
        const stages = stagesFor(ch);
        const span = document.createElement("span");
        container.appendChild(span);

        stages.forEach((stg, i) => {
          const at = t, first = i === 0;
          later(() => {
            span.textContent = stg;
            span.style.opacity = 1;
            if (reduced) {
              span.animate([{ opacity: first ? 0 : 0.45 }, { opacity: 1 }],
                           { duration: first ? 260 : 150, fill: "both" });
            } else if (first) {
              span.animate(
                [{ opacity: 0, transform: "translateY(.35em)", filter: "blur(8px)" },
                 { opacity: 1, transform: "none",             filter: "blur(0)"   }],
                { duration: 560, easing: "cubic-bezier(.2,.75,.2,1)", fill: "both" });
            } else {
              span.animate(
                [{ transform: "scale(.82)", filter: "blur(4px)" },
                 { transform: "scale(1)",   filter: "blur(0)"   }],
                { duration: 340, easing: "cubic-bezier(.2,.8,.2,1)" });
            }
          }, at);
          t += (i < stages.length - 1) ? JAMO : LETTER;
        });
      });

      const emojiSpan = document.createElement("span");
      emojiSpan.className = "emoji";
      emojiSpan.textContent = DATA[word.dataset.key].emoji;
      container.appendChild(emojiSpan);
      later(() => fadeIn(emojiSpan, 400), t);

      const label = word.querySelector(".label");
      later(() => fadeIn(label, 500), t);
      t += WORD;
    });

    later(() => foot.forEach((e) => fadeIn(e, 700)), t + 150);
  }

  let booted = false;
  const boot = () => { if (booted) return; booted = true; requestAnimationFrame(play); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot);
  setTimeout(boot, 800);

  // ---------- Replay ----------
  const replayBtn = document.getElementById("replay");
  replayBtn.addEventListener("click", play);
  document.addEventListener("keydown", (e) => {
    if ((e.key === "r" || e.key === "R") && !scrim.classList.contains("open") && !introScrim.classList.contains("open")) play();
  });

  // ---------- Spill panel ----------
  const scrim  = document.getElementById("scrim");
  const panel  = scrim.querySelector(".panel");
  const closeB = document.getElementById("close");
  const kicker = document.getElementById("p-kicker");
  const title  = document.getElementById("p-title");
  const bodyEl = document.getElementById("p-body");
  const contentEl = document.getElementById("p-content");
  let lastFocus = null;

  function open(key) {
    const d = DATA[key];
    lastFocus = document.activeElement;
    kicker.textContent = KICKER_TEXT;
    title.textContent = d.phrase;
    bodyEl.innerHTML = d.body || "";
    contentEl.scrollTop = 0;
    scrim.style.setProperty("--c", COLOR[key]);
    scrim.classList.remove("open");
    void panel.offsetWidth;
    scrim.classList.add("open");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => closeB.focus());
  }
  function close() {
    scrim.classList.remove("open");
    document.body.style.overflow = "";
    if (lastFocus) lastFocus.focus();
  }

  words.forEach((w) => w.addEventListener("click", () => open(w.dataset.key)));
  closeB.addEventListener("click", close);
  scrim.addEventListener("click", (e) => { if (e.target === scrim) close(); });

  // ---------- Intro tutorial popup ----------
  const INTRO_SLIDES = [
    '이곳 <span class="hi">ESD 국제청소년캠프</span>에 모인 여러분은 지역과 학교, 세상에서 평화🕊️를 달성하기 위해 모험을 떠나야 하는 사명을 가진 <span class="hi">평화의 용사</span>🛡️입니다…',
    '<span class="hi">몇 시간 후면</span> 캠프가 끝나고 세상🌏으로 나가 평화를 위해 각자의 삶에서 노력하게 될 텐데요…',
    '잠깐… 이불 밖은 위험해!<br>용사님, 모험을 떠나기 전에, <span class="hi">2026 세종RCE ESD 국제청소년캠프 평화분과</span>🕊️ 친구들이 여러분을 위해 준비한 이 아이템🧪🛡️🪄✨을 잊지 말고 챙겨가세요! 😌'
  ];

  const introScrim = document.getElementById("introScrim");
  const introPanel = introScrim.querySelector(".panel");
  const introText  = document.getElementById("introText");
  const introPrev  = document.getElementById("introPrev");
  const introNext  = document.getElementById("introNext");
  let introIndex = 0;

  const SYLLABLE = 26;
  let introTimers = [];
  const laterIntro = (fn, ms) => introTimers.push(setTimeout(fn, ms));
  const clearIntroTimers = () => { introTimers.forEach(clearTimeout); introTimers = []; };

  // Construct syllable nodes grouped by word-wrappers to bind words, commas, emojis, and spaces together
  function buildSyllableNodes(html) {
    const src = document.createElement("div");
    src.innerHTML = html;
    const segmenter = (typeof Intl !== "undefined" && Intl.Segmenter)
      ? new Intl.Segmenter("ko", { granularity: "grapheme" })
      : null;
    const nodes = [];

    let currentWrapper = document.createElement("span");
    currentWrapper.className = "word-wrapper";

    function flushWrapper() {
      if (currentWrapper.hasChildNodes()) {
        nodes.push(currentWrapper);
        currentWrapper = document.createElement("span");
        currentWrapper.className = "word-wrapper";
      }
    }

    (function walk(node, hi) {
      node.childNodes.forEach((child) => {
        if (child.nodeType === Node.TEXT_NODE) {
          const graphemes = segmenter
            ? Array.from(segmenter.segment(child.textContent), (s) => s.segment)
            : Array.from(child.textContent);

          graphemes.forEach((g) => {
            if (g === " ") {
              // Create space syllable glued inside the current word unit before starting a new word unit
              const spaceSpan = document.createElement("span");
              spaceSpan.className = hi ? "syl hi" : "syl";
              spaceSpan.textContent = "\u00A0"; // Non-breaking space keeps space glued adjacent to word
              currentWrapper.appendChild(spaceSpan);
              flushWrapper();
              return;
            }
            const span = document.createElement("span");
            span.className = hi ? "syl hi" : "syl";
            span.textContent = g;
            currentWrapper.appendChild(span);
          });
        } else if (child.nodeName === "BR") {
          flushWrapper();
          nodes.push(document.createElement("br"));
        } else {
          walk(child, hi || child.classList.contains("hi"));
        }
      });
    })(src, false);

    flushWrapper();
    return nodes;
  }

  function renderIntro() {
    clearIntroTimers();
    introText.innerHTML = "";
    introPrev.hidden = introIndex === 0;
    const elements = buildSyllableNodes(INTRO_SLIDES[introIndex]);
    elements.forEach((node) => introText.appendChild(node));

    let t = 0;
    introText.querySelectorAll(".syl").forEach((span) => {
      const at = t;
      laterIntro(() => {
        span.style.opacity = 1;
        if (reduced) {
          span.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 120, fill: "both" });
        } else {
          span.animate(
            [{ opacity: 0, transform: "translateY(.3em)", filter: "blur(6px)" },
             { opacity: 1, transform: "none",             filter: "blur(0)"   }],
            { duration: 320, easing: "cubic-bezier(.2,.75,.2,1)", fill: "both" });
        }
      }, at);
      t += SYLLABLE;
    });
  }

  function openIntro() {
    introIndex = 0;
    renderIntro();
    introScrim.classList.add("open");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => introPanel.focus());
  }
  function closeIntro() {
    clearIntroTimers();
    introScrim.classList.remove("open");
    document.body.style.overflow = "";
    if (!reduced) hud.classList.add("tremble");
  }

  introNext.addEventListener("click", () => {
    if (introIndex < INTRO_SLIDES.length - 1) {
      introIndex++;
      renderIntro();
    } else {
      closeIntro();
    }
  });
  introPrev.addEventListener("click", () => {
    if (introIndex > 0) {
      introIndex--;
      renderIntro();
    }
  });
  introScrim.addEventListener("click", (e) => { if (e.target === introScrim) closeIntro(); });

  const storyToggle = document.getElementById("storyToggle");
  storyToggle.addEventListener("click", () => {
    if (scrim.classList.contains("open")) close();
    openIntro();
  });

  openIntro();

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (introScrim.classList.contains("open")) closeIntro();
    else if (scrim.classList.contains("open")) close();
  });
</script>
</body>
</html>
